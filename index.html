
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1b">
    <title>¡Hola Mundo! | Mi primera web</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(ellipse at 10% 10%,
                    #182b72 0%, transparent 35%),
                radial-gradient(ellipse at 90% 90%,
                    #36156b 0%, transparent 35%),
                #080d1b;
        }

        .card {
            width: 100%;
            max-width: 760px;
            text-align: center;
            padding: 55px 30px;
            border: 1px solid rgba(130, 150, 255, 0.22);
            border-radius: 28px;
            background: rgba(14, 22, 43, 0.72);
            box-shadow: 0 25px 100px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(15px);
            animation: appear 0.9s ease-out;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(90, 240, 160, 0.25);
            border-radius: 50px;
            color: #a9f5cb;
            background: rgba(25, 170, 100, 0.09);
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #50ee91;
            box-shadow: 0 0 12px #50ee91;
        }

        h1 {
            margin-bottom: 20px;
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: -3px;
        }

        h1 span {
            background: linear-gradient(100deg, #22d3ee, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .description {
            max-width: 540px;
            margin: 0 auto 30px;
            color: #bac6df;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .code {
            display: inline-block;
            margin-bottom: 28px;
            padding: 14px 22px;
            border: 1px solid #283656;
            border-radius: 12px;
            background: #090f20;
            color: #91a9d5;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        .code span {
            color: #6ee7b7;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            color: #080d1b;
            background: linear-gradient(100deg, #67e8f9, #a5b4fc);
            font-size: 15px;
            font-weight: 750;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(103, 232, 249, 0.25);
        }

        #message {
            min-height: 24px;
            margin-top: 20px;
            color: #a5f3fc;
            font-size: 14px;
        }

        footer {
            margin-top: 32px;
            color: #687998;
            font-size: 12px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 20px;
            }

            h1 {
                letter-spacing: -1.5px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="badge">
            <span class="dot"></span>
            ¡Tu página está lista para despegar!
        </div>

        <h1>¡Hola <span>Mundo!</span></h1>

        <p class="description">
            Bienvenido a mi primera página web desplegada en Vercel.
            Pequeño proyecto, grandes posibilidades. 🚀
        </p>

        <div class="code">
            <span>console.log</span>("¡Hola Mundo!");
        </div>
        <br>

        <button onclick="saludar()">
            ✨ Presióname
        </button>

        <p id="message" aria-live="polite"></p>

        <footer>
            Hecho con ❤️, HTML, CSS y JavaScript
        </footer>
    </main>

    <script>
        function saludar() {
            document.getElementById("message").textContent =
                "¡Funcionó, we! JavaScript está al 100. 🔥";
        }
    </script>
</body>
</html>
